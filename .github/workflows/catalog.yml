name: catalog-check

# Primer chequeo después de cargar GDRIVE_SA_JSON: lista lo que el pipeline ve en tu Drive.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Listar catálogo
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: python -m autotube.run catalog | tee catalog.txt >> "$GITHUB_STEP_SUMMARY"
